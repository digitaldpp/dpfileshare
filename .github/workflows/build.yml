name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test the server
        run: npm test
      - name: Build the exe
        run: npm run build
      - name: Test the packed server
        run: npm test
        env:
          DPFS_ENGINE: ${{ github.workspace }}\build\dpfs-engine.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DP File Share
          path: dist/DP File Share.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DP File Share
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" "DP File Share.exe" --repo "$GITHUB_REPOSITORY" --title "DP File Share ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
